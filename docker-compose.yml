services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factoryvision
      POSTGRES_USER: factoryvision
      POSTGRES_PASSWORD: factoryvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryvision -d factoryvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FACTORYVISION_DATABASE_URL: postgresql+psycopg://factoryvision:factoryvision@postgres:5432/factoryvision
      FACTORYVISION_ONNX_MODEL: /app/artifacts/models/factoryvision-segmentation.onnx
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16
    environment:
      PGPASSWORD: factoryvision
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until pg_isready -h postgres -U factoryvision -d factoryvision; do sleep 1; done;
        psql -h postgres -U factoryvision -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow'" | grep -q 1 ||
        psql -h postgres -U factoryvision -d postgres -c "CREATE DATABASE mlflow"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://factoryvision:factoryvision@postgres:5432/factoryvision
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      FACTORYVISION_DATABASE_URL: postgresql+psycopg://factoryvision:factoryvision@postgres:5432/factoryvision
      FACTORYVISION_ONNX_MODEL: /app/artifacts/models/factoryvision-segmentation.onnx
      FACTORYVISION_BATCH_IMAGE_DIR: /app/data/batch/incoming
      FACTORYVISION_BATCH_ARTIFACT_DIR: /app/artifacts/batch
    volumes: &airflow-volumes
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./data/batch:/app/data/batch:ro
      - ./artifacts:/app/artifacts
    entrypoint: ["/bin/bash"]
    command: ["/usr/local/bin/factoryvision-airflow-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: ["airflow", "api-server", "--port", "8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://factoryvision:factoryvision@postgres:5432/mlflow
      - --artifacts-destination
      - /mlartifacts
      - --serve-artifacts
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: factoryvision
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  airflow_home:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
