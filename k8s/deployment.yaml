apiVersion: apps/v1
kind: Deployment
metadata:
  name: factoryvision-api
  labels:
    app.kubernetes.io/name: factoryvision-api
    app.kubernetes.io/part-of: factoryvision
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: factoryvision-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factoryvision-api
        app.kubernetes.io/part-of: factoryvision
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: factoryvision-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: factoryvision-api-config
          # The ONNX file is a generated, ignored artifact. For a local cluster,
          # make the host model directory available at this node path first.
          volumeMounts:
            - name: model
              mountPath: /app/artifacts/models
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: model
          hostPath:
            path: /mnt/factoryvision-models
            type: Directory
