[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryvision"
version = "0.1.0"
description = "Production-oriented industrial surface defect segmentation and MLOps platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.1",
    "opencv-python-headless==4.13.0.92",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "python-multipart==0.0.20",
    "onnxruntime==1.20.1",
    "prometheus-client==0.22.1",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
training = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "pandas==2.3.1",
    "matplotlib==3.10.0",
    "kedro==1.5.0",
    "mlflow==3.14.0",
    "onnx==1.17.0",
]
analytics = [
    "pyspark==3.5.6",
]
dev = [
    "dvc==3.67.1",
    "jupyter==1.1.1",
    "pytest==9.0.3",
]
ci = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.kedro]
package_name = "factoryvision"
project_name = "factoryvision-mlops"
kedro_init_version = "1.5.0"
tools = ""
example_pipeline = "False"
source_dir = "src"

# The CUDA-enabled PyTorch wheels should be installed from the official
# PyTorch index that matches the working local CUDA setup.

[tool.kedro_telemetry]
project_id = "68a12bfcd8054e82a24ab018d81cfcb2"
